[package]
name = "wcl_lang-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Detached from the parent workspace — cargo-fuzz needs its own release
# profile / sanitizer config and shouldn't be a workspace member.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.wcl_lang]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[[bin]]
name = "eval"
path = "fuzz_targets/eval.rs"
test = false
doc = false

[[bin]]
name = "format_round_trip"
path = "fuzz_targets/format_round_trip.rs"
test = false
doc = false

[[bin]]
name = "json_round_trip"
path = "fuzz_targets/json_round_trip.rs"
test = false
doc = false

[[bin]]
name = "set_edit_path"
path = "fuzz_targets/set_edit_path.rs"
test = false
doc = false
