[package]
name = "wcl_lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WCL language library: parser and AST"

[dependencies]
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The snapshot tests render diagnostics through `GraphicalReportHandler`; the
# library itself stays on plain miette. Not `fancy-no-syscall`, for the
# reason given in crates/wcl_wdoc/Cargo.toml.
miette = { workspace = true, features = ["fancy-no-backtrace"] }
criterion = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "eval_scale"
harness = false

[[bench]]
name = "wide"
harness = false

[lints]
workspace = true
