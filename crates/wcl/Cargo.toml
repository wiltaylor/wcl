[package]
name = "wcl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WCL command-line interface"

[[bin]]
name = "wcl"
path = "src/main.rs"

[dependencies]
wcl_lang = { workspace = true }
wcl_lsp = { workspace = true }
# `serve` is the `wcl wdoc serve` dev server.
wcl_wdoc = { workspace = true, features = ["serve"] }
clap = { workspace = true }
# `fancy` renders every `miette::Report` graphically on stderr. The CLI owns
# the terminal, so it is the one crate that turns on terminal detection.
miette = { workspace = true, features = ["fancy"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
# The runtime `wcl lsp` and `wcl wdoc serve` run on (the server itself, and
# the features it needs, live in wcl_wdoc's `serve` feature).
tokio = { workspace = true }
dunce = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
