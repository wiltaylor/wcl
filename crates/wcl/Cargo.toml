[package]
name = "wcl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WCL command-line interface"

[[bin]]
name = "wcl"
path = "src/main.rs"

[dependencies]
wcl_lang = { workspace = true }
wcl_lsp = { workspace = true }
wcl_wdoc = { workspace = true }
clap = { workspace = true }
# `fancy` renders every `miette::Report` graphically on stderr. The CLI owns
# the terminal, so it is the one crate that turns on terminal detection.
miette = { workspace = true, features = ["fancy"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
# `wcl wdoc serve` dev server: axum + a notify file watcher, driven on a
# tokio runtime (extra `fs` for the static handler, `signal` for Ctrl-C,
# `time` for rebuild debouncing and the live-reload long-poll timeout).
tokio = { workspace = true, features = ["fs", "signal", "time"] }
axum = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
