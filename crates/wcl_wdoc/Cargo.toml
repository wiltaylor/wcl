[package]
name = "wcl_wdoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WCL-driven static site / document generator (library)"

[dependencies]
wcl_lang = { workspace = true }
# `BuildError::render_plain` draws reports with `GraphicalReportHandler` and an
# explicit no-colour theme, so the handler is needed but terminal detection
# is not.
miette = { workspace = true, features = ["fancy-no-syscall"] }
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy", "html"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
avt = "0.18"
serde_json = { workspace = true }
# Calendar math for the time-axis `timeline` (date arithmetic, julian-day
# conversion). Dates are hand-parsed, so default features suffice. Already
# in the lockfile via syntect.
time = "0.3"
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-svg = { version = "0.1", features = ["embed-fonts"] }
ratex-types = "0.1"
# PDF backend (`wcl wdoc build --type pdf`). krilla is the pure-Rust PDF writer (Typst's
# backend); krilla-svg embeds our existing SVG output vector-preserving via
# usvg; cosmic-text shapes + line-breaks prose for the layout engine.
krilla = "0.8"
krilla-svg = "0.8"
# Shaping and line-breaking only: glyphs are drawn by krilla, so swash (the
# rasteriser) is off, and fonts come from bundled bytes, so no fontconfig.
cosmic-text = { version = "0.19", default-features = false, features = ["std"] }
# krilla-svg does not re-export usvg, so it is a direct dependency. We parse
# our SVG output into a `usvg::Tree` and hand it to `Surface::draw_svg`, so
# this must stay the same usvg krilla-svg embeds (0.47) — bump them together.
usvg = "0.47"
# The `serve` feature: the `wcl wdoc serve` dev server. axum + a notify file
# watcher, driven on a tokio runtime (extra `fs` for the static handler,
# `signal` for Ctrl-C, `time` for rebuild debouncing and the live-reload
# long-poll timeout), and tempfile for the default scratch output dir.
tokio = { workspace = true, features = ["fs", "signal", "time"], optional = true }
axum = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
# Off by default: a library user who only renders documents does not get an
# HTTP server, an async runtime or a file watcher. The `wcl` binary enables it.
serve = ["dep:tokio", "dep:axum", "dep:notify", "dep:tempfile"]

[dev-dependencies]
tempfile = { workspace = true }
# Drives the dev server's router in process (`ServiceExt::oneshot`).
tower = { workspace = true }

# The build script generates the content IR from `lib/content.wcl`, so it
# parses WCL with the real parser rather than a second, approximate one.
[build-dependencies]
wcl_lang = { workspace = true }

[lints]
workspace = true
