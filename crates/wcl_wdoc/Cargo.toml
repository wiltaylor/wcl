[package]
name = "wcl_wdoc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WCL-driven static site / document generator (library)"

[dependencies]
wcl_lang = { workspace = true }
miette = { workspace = true }
regex = "1"
tokio = { workspace = true, features = ["fs", "signal"] }
axum = { workspace = true }
notify = { workspace = true }
tempfile = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-fancy", "html"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
avt = "0.18"
serde_json = { workspace = true }
# Calendar math for the time-axis `timeline` (date arithmetic, julian-day
# conversion). Dates are hand-parsed, so default features suffice. Already
# in the lockfile via syntect.
time = "0.3"
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-svg = { version = "0.1", features = ["embed-fonts"] }
ratex-types = "0.1"

[lints]
workspace = true
