[workspace]
resolver = "2"
members = ["crates/wcl", "crates/wcl_lang"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wiltaylor/wcl"

[workspace.dependencies]
wcl_lang = { path = "crates/wcl_lang", version = "0.0.0" }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
