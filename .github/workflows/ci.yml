name: CI

# Pushes run only for main: every other branch reaches CI through its pull
# request, so a pushed PR branch is not tested twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; the one job that writes (release) asks for it.
permissions:
  contents: read

# A newer push to a PR branch supersedes the run in flight. main never
# cancels, and every main commit gets its own group, so a queued run carrying
# a `pre-release: true` trailer is never dropped in favour of a later commit.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + lint + docs + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain action: rustup reads rust-toolchain.toml, so CI builds
      # with exactly the pinned release (and its components) that a local
      # checkout does. `rustup toolchain install` with no argument installs it.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      # Every step below is one part of the merge bar, invoked through the
      # `ci` just module (.just/ci/mod.just) so the workflow and the local
      # gate cannot drift. `just ci::check` runs the same list in one go.
      # Each part is independently runnable, so this job could be fanned out
      # one-part-per-job; they share a job on purpose, because every part
      # needs the same cargo build and a separate job would re-pay it.
      - run: just ci::fmt-check
      - run: just ci::workspace-lint
      - run: just ci::workspace-doc
      - run: just ci::workspace-test
      # The docs/ sites are the largest real-world wdoc consumer — building
      # them catches renderer regressions that unit tests miss, and broken
      # doc pages, before they reach the deploy workflow. Same two
      # invocations, same order, as deploy-site.yml.
      #
      # Two gate parts, one step: `docs-relative-urls` depends on `docs-build`
      # and greps what it just wrote for a root-absolute `href="/…"` / `src="/…"`,
      # which would break the book the moment it is served from `/reference/`.
      # Naming both here would render the sites twice — separate `just`
      # invocations don't share a dependency graph, where `just ci::check` does.
      - run: just ci::docs-relative-urls

  # ── Other platforms ───────────────────────────────────────────────────────
  # The test suite on the other two OSes the CLI ships for. Lint, docs and
  # the site build are platform-independent, so they stay on Linux only.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      - run: just ci::workspace-test

  # ── Supply chain ──────────────────────────────────────────────────────────
  # Advisories, licenses, bans and sources, per deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ── Reference coverage ────────────────────────────────────────────────────
  # The book documents every builtin, subcommand and wdoc block kind the
  # freshly built binary exposes.
  docs-coverage:
    name: reference coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@just
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
      - run: just docs-coverage

  # ── Editors ───────────────────────────────────────────────────────────────
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: taiki-e/install-action@just
      - run: just vscode-build

  tree-sitter:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-wcl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # package.json pins tree-sitter-cli; `npx` runs that copy.
      - run: npm install
      - run: npx tree-sitter generate
      # Runs the corpus under test/corpus/.
      - run: npx tree-sitter test

  # ── Fuzz smoke ────────────────────────────────────────────────────────────
  # Bounded sweep over every wcl_lang and wcl_wdoc fuzz target (~15s each)
  # so parser / evaluator / printer / wdoc build regressions on the
  # corpus-adjacent inputs are caught on each push, not only when someone
  # runs the fuzzers locally.
  fuzz:
    name: fuzz smoke (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@just
      # Explicit `tool:` form — the `@cargo-fuzz` ref pins a commit but leaves
      # the tool input empty, so nothing gets installed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          workspaces: |
            crates/wcl_lang/fuzz
            crates/wcl_wdoc/fuzz
      - run: just ci::fuzz-sweep

  # ── Version ───────────────────────────────────────────────────────────────
  # Trailer-gated. Only `pre-release: true` cuts a GitHub pre-release (an -alpha
  # version with artifacts). A stable `release: true` is intentionally blocked —
  # WCL isn't ready for it yet.
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: calc
        run: |
          IS_RELEASE=$(git log -1 --format='%(trailers:key=release,valueonly)')
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')

          # Stable releases are disabled for now — fail loudly so a `release:`
          # trailer can't accidentally ship a stable version.
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "::error::Stable releases are disabled — WCL is pre-release only. Use a 'pre-release: true' trailer instead."
            exit 1
          fi

          if [[ "$IS_PRERELEASE" != "true" ]]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No publish trailer on HEAD — tests only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Next version = bump from the last v* tag, scanning conventional
          # commits since that tag for the bump level (0.x: major -> minor).
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            PREV_MAJOR=0; PREV_MINOR=0; PREV_PATCH=0; RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"; VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' "$RANGE")
          [[ "$BUMP" == "none" ]] && BUMP="patch"

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then MAJOR=0; MINOR=$((PREV_MINOR + 1)); PATCH=0
              else MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0; fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha"
          echo "Calculated version: $VERSION (bump=$BUMP, from ${LAST_TAG:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Pre-release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── CLI binaries ────────────────────────────────────────────────────────
  # Build the `wcl` CLI for every platform install.sh / install.ps1 serve.
  # Version-stamped so `wcl --version` is correct. The asset suffixes are a
  # contract with the installers — change them together.
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [version, check, test]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: wcl
            suffix: linux-x86_64
          # Statically linked, for musl distributions (Alpine) and anywhere
          # the glibc build is too new. `psm` (under `stacker`) assembles a
          # small C/asm shim, so the runner needs musl-tools' `musl-gcc`.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: wcl
            suffix: linux-x86_64-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: wcl
            suffix: macos-aarch64
          # Cross-compiled on the Apple-silicon runner; the SDK carries both.
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: wcl
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: wcl.exe
            suffix: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Install musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Stamp version
        run: .github/scripts/stamp-version.sh "${{ needs.version.outputs.version }}"
      - name: Build
        run: cargo build --locked -p wcl --bin wcl --release --target ${{ matrix.target }}
      - name: Stage asset
        run: |
          V="${{ needs.version.outputs.version }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "wcl-$V-${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: wcl-*-${{ matrix.suffix }}
          retention-days: 1

  # ── VS Code extension ─────────────────────────────────────────────────────
  # The extension finds `wcl` on PATH, so the .vsix is platform-independent.
  # vsce requires a plain major.minor.patch version, so we stamp the numeric core.
  package-vscode:
    name: Package VS Code (.vsix)
    needs: [version, check, vscode]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: taiki-e/install-action@just
      - name: Stamp vsix version
        run: |
          V="${{ needs.version.outputs.version }}"
          NUM="${V%-alpha}"
          sed -i -E 's/("version": ")[^"]+(")/\1'"$NUM"'\2/' editors/vscode/package.json
      - run: just vscode-package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: editors/vscode/*.vsix
          retention-days: 1

  # ── Release ─────────────────────────────────────────────────────────────
  # Gather the CLI binaries + .vsix, checksum them, and cut a GitHub
  # pre-release with all of it attached. The tag is created by the release
  # itself (`target_commitish`), so a failed release leaves no orphan tag
  # behind to poison the next version calculation.
  release:
    name: Create GitHub pre-release
    needs: [version, build-cli, package-vscode]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never cancelled: a half-created release would outlive the cancel.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # install.sh and install.ps1 verify their download against this file
      # and refuse to install on a mismatch or a missing entry.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
