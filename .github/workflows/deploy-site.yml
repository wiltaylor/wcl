name: Deploy Site

# Builds the WCL documentation site (docs/main.wcl -> docs/_site) with the
# `wcl` CLI and deploys it to Cloudflare Pages (project "wcl-dev", configured
# in wrangler.toml). Runs only when files under docs/ change on main, so an
# ordinary code push doesn't trigger a (slow) Rust build + deploy.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The deploy only runs `wcl wdoc build`; the embedded `wcl editor`
      # frontend is never served here, so skip building it. Without this,
      # crates/wcl's build.rs panics on a runner that has no pnpm and no
      # prebuilt editor-ui/dist — installing node + pnpm just to throw the
      # result away would cost minutes per deploy.
      - name: Build wcl
        run: cargo build --release -p wcl
        env:
          WCL_EDITOR_UI_SKIP: '1'

      - name: Build docs site
        run: ./target/release/wcl wdoc build docs/main.wcl --out docs/_site

      # Ship the install scripts at the site root so the curl/iwr one-liners
      # resolve (https://wcl.dev/install.sh, .../install.ps1). docs/_site is
      # regenerated each deploy, so the copy lives here, not in the repo.
      - name: Stage install scripts
        run: cp install.sh install.ps1 docs/_site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
