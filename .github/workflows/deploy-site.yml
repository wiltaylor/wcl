name: Deploy Site

# Builds wcl.dev with the `wcl` CLI and deploys it to Cloudflare Pages
# (project "wcl-dev", configured in wrangler.toml). Two documents, two
# invocations, one output tree:
#
#   docs/landing/main.wcl   -> docs/_site           (/)
#   docs/reference/main.wcl -> docs/_site/reference  (/reference/)
#
# The build is `just docs-relative-urls`, the same gate part CI runs: it
# renders both documents through `docs-build` and then refuses the tree if
# any URL in it is root-absolute. What ships is exactly what the gate
# checked, and a site that fails the check never deploys — this workflow
# triggers on its own paths, so it does not wait for CI's result.
#
# Runs only when the site's own inputs change on main, so an ordinary code
# push doesn't trigger a (slow) Rust build + deploy. `workflow_dispatch` is
# the lever for a redeploy after a renderer change.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue rather than cancel: an interrupted `pages deploy` could
# leave a half-uploaded site live.
concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml — the same pinned release CI uses.
      - run: rustup toolchain install

      - uses: taiki-e/install-action@just

      - uses: Swatinem/rust-cache@v2

      - name: Build and check the site
        run: just docs-relative-urls

      # Ship the install scripts at the site root so the curl/iwr one-liners
      # resolve (https://wcl.dev/install.sh, .../install.ps1). docs/_site is
      # regenerated each deploy, so the copy lives here, not in the repo.
      - name: Stage install scripts
        run: cp install.sh install.ps1 docs/_site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
