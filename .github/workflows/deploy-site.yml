name: Deploy Site

# Builds wcl.dev with the `wcl` CLI and deploys it to Cloudflare Pages
# (project "wcl-dev", configured in wrangler.toml). Two documents, two
# invocations, one output tree:
#
#   docs/landing/main.wcl   -> docs/_site           (/)
#   docs/reference/main.wcl -> docs/_site/reference  (/reference/)
#
# These are the same two steps, in the same order, that `just docs-build`
# runs — the gate builds what the deploy ships, so they cannot drift.
#
# Runs only when the site's own inputs change on main, so an ordinary code
# push doesn't trigger a (slow) Rust build + deploy. `workflow_dispatch` is
# the lever for a redeploy after a renderer change.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wcl
        run: cargo build --release -p wcl

      # A build tree is self-contained and relocatable by design, and `build`
      # never wipes its `--out` dir. The second invocation therefore writes
      # into the first one's output safely. No staging directory, and nothing
      # is copied. Order matters: build the landing first.
      - name: Build the landing page
        run: ./target/release/wcl wdoc build docs/landing/main.wcl --out docs/_site

      - name: Build the reference book
        run: ./target/release/wcl wdoc build docs/reference/main.wcl --out docs/_site/reference

      # Ship the install scripts at the site root so the curl/iwr one-liners
      # resolve (https://wcl.dev/install.sh, .../install.ps1). docs/_site is
      # regenerated each deploy, so the copy lives here, not in the repo.
      - name: Stage install scripts
        run: cp install.sh install.ps1 docs/_site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
