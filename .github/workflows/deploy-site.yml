name: Deploy Site

# Builds the WCL documentation site (docs/main.wcl -> docs/_site) with the
# `wcl` CLI and deploys it to Cloudflare Pages (project "wcl-dev", configured
# in wrangler.toml). Runs only when files under docs/ change on main, so an
# ordinary code push doesn't trigger a (slow) Rust build + deploy.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wcl
        run: cargo build --release -p wcl

      - name: Build docs site
        run: ./target/release/wcl wdoc build docs/main.wcl --out docs/_site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
